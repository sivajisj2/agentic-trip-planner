name: Skill validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/score_destinations.py --input examples/goa-group-input.json
      - run: python scripts/calculate_budget.py --input examples/goa-budget.json
      - run: python scripts/validate_itinerary.py --input examples/goa-itinerary.json
